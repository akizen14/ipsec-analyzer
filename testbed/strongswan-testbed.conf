# Testbed overrides for charon, mounted into /etc/strongswan.d/.
#
# bypass-lan is the important one. It installs xfrm "pass" policies for every
# directly connected subnet, at a numerically lower (so higher) priority than the
# tunnel policy charon installs for the connection:
#
#   src 10.80.0.0/24 dst 10.80.0.0/24  dir out  priority 175423   <- bypass wins
#   src 10.80.0.2/32 dst 10.80.0.3/32  dir out  priority 367231   <- ESP policy
#
# On a real gateway that is sensible: it keeps local LAN traffic out of the
# tunnel. In a lab where both peers sit on one bridge it means IKE completes, the
# SAs install, and then not one packet is encrypted. The capture looks almost
# right, which is the worst kind of wrong for a labelled dataset.
charon {
    plugins {
        bypass-lan {
            load = no
        }
    }

    # Keep retransmission behaviour fixed so timing features in the dataset are a
    # property of the configuration under test, not of a varying default.
    retransmit_timeout = 4.0
    retransmit_base = 1.8
    retransmit_tries = 5

    # Log at a level that records proposal selection, which the manifest writer
    # reads back to confirm the agreed suite matches the requested one.
    filelog {
        testbed {
            path = /out/charon.log
            default = 2
            ike = 2
            cfg = 2
            append = no
            flush_line = yes
            time_format = %Y-%m-%d %H:%M:%S
        }
    }
}
