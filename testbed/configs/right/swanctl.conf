# Responder. Hand-written for the vertical slice; phase 1 renders this from the
# parameter matrix so the manifest labels and the configuration always agree.
#
# Mirrors left/swanctl.conf. The responder offers the same single proposal, so a
# successful handshake proves both ends agreed on exactly the suite the manifest
# claims.
connections {
    lab {
        version = 2
        local_addrs  = 10.80.0.3
        remote_addrs = 10.80.0.2

        proposals = aes256-sha256-prfsha256-modp2048

        rekey_time = 60s
        over_time = 10s
        rand_time = 0s

        local {
            auth = psk
            id = right.testbed
        }
        remote {
            auth = psk
            id = left.testbed
        }

        children {
            net {
                local_ts  = 10.80.0.3/32
                remote_ts = 10.80.0.2/32
                esp_proposals = aes256-sha256-modp2048
                mode = tunnel
                rekey_time = 45s
                rand_time = 0s
                start_action = none
                dpd_action = none
            }
        }
    }
}

secrets {
    ike-lab {
        id-left  = left.testbed
        id-right = right.testbed
        secret   = "testbed-psk-public-value-not-a-secret"
    }
}
