# Initiator. Hand-written for the vertical slice; phase 1 renders this from the
# parameter matrix so the manifest labels and the configuration always agree.
#
# Ground truth for the capture this produces:
#   IKE:  AES-CBC-256 / HMAC-SHA2-256 / PRF HMAC-SHA2-256 / DH group 14
#   ESP:  AES-CBC-256 / HMAC-SHA2-256, tunnel mode, PFS on rekey (DH group 14)
#   Auth: pre-shared key
connections {
    lab {
        version = 2
        local_addrs  = 10.80.0.2
        remote_addrs = 10.80.0.3

        # One proposal only, so the capture has an unambiguous expected value.
        # The downgrade rules get exercised by a separate multi-proposal run.
        proposals = aes256-sha256-prfsha256-modp2048

        # Short so a rekey lands inside a 90-second capture, which is what makes
        # PFS and lifetime observable at all (PLAN.md phase 1).
        rekey_time = 60s
        over_time = 10s
        rand_time = 0s

        local {
            auth = psk
            id = left.testbed
        }
        remote {
            auth = psk
            id = right.testbed
        }

        children {
            net {
                local_ts  = 10.80.0.2/32
                remote_ts = 10.80.0.3/32
                esp_proposals = aes256-sha256-modp2048
                mode = tunnel
                rekey_time = 45s
                rand_time = 0s
                start_action = none
                dpd_action = none
            }
        }
    }
}

secrets {
    ike-lab {
        id-left  = left.testbed
        id-right = right.testbed
        secret   = "testbed-psk-public-value-not-a-secret"
    }
}
