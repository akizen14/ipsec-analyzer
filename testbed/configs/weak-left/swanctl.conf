# Deliberately weak initiator, for negative test cases.
#
# Offers a strong suite alongside weak ones. The responder accepts only the weak
# one, so the agreed suite is a downgrade from what was on offer.
#
# Ground truth, and the rules it should trigger:
#   IKE 3DES / SHA-1 / DH group 2  -> IKE-011, IKE-021, IKE-031
#   strong offered, weak selected  -> IKE-040, IKE-041
#   ESP 3DES (8-byte block)        -> ESP-010, once residues are informative
connections {
    lab {
        version = 2
        local_addrs  = 10.80.0.2
        remote_addrs = 10.80.0.3

        proposals = aes256-sha256-prfsha256-modp2048,3des-sha1-prfsha1-modp1024

        local {
            auth = psk
            id = left.testbed
        }
        remote {
            auth = psk
            id = right.testbed
        }

        children {
            net {
                local_ts  = 10.80.0.2/32
                remote_ts = 10.80.0.3/32
                esp_proposals = 3des-sha1
                mode = tunnel
                start_action = none
                dpd_action = none
            }
        }
    }
}

secrets {
    ike-lab {
        id-left  = left.testbed
        id-right = right.testbed
        secret   = "testbed-psk-public-value-not-a-secret"
    }
}
