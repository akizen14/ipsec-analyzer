# Deliberately weak responder: accepts only the weak suite, forcing the downgrade.
#
# The initiator offers AES-256 as well, so the agreed suite being 3DES is a
# genuine downgrade rather than a matched policy. That is what rule IKE-040 is
# meant to catch.
connections {
    lab {
        version = 2
        local_addrs  = 10.80.0.3
        remote_addrs = 10.80.0.2

        proposals = 3des-sha1-prfsha1-modp1024

        local {
            auth = psk
            id = right.testbed
        }
        remote {
            auth = psk
            id = left.testbed
        }

        children {
            net {
                local_ts  = 10.80.0.3/32
                remote_ts = 10.80.0.2/32
                esp_proposals = 3des-sha1
                mode = tunnel
                start_action = none
                dpd_action = none
            }
        }
    }
}

secrets {
    ike-lab {
        id-left  = left.testbed
        id-right = right.testbed
        secret   = "testbed-psk-public-value-not-a-secret"
    }
}
